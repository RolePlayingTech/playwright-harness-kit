name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run unit, build and CLI tests
        run: npm test
      - name: Validate example Playwright verification contract (strict mode)
        run: npm run check
      - name: Verify example explain and dry-run build
        run: |
          npm run explain
          npm run build:dry-run
          npm pack --dry-run
